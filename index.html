<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本周全球最受关注的开源项目 · GitHub Trending 周榜</title>
  <meta name="description" content="GitHub Trending 周榜监控：每周全球最受关注的 10 个开源项目，按本周新增 Star 排名，每日自动更新。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <h1>本周全球最受关注的 <span class="num" id="top-count">10</span> 个开源项目</h1>
      <p class="sub" id="subtitle">GITHUB TRENDING 周榜</p>
    </header>

    <div class="table-head" role="presentation">
      <span>排名</span><span>项目</span><span>所属公司</span><span>趋势</span><span>本周新增关注</span><span>累计关注</span>
    </div>

    <section id="ranking" aria-live="polite">
      <div class="loading">正在加载最新榜单…</div>
    </section>

    <section class="trends" id="trends-section" hidden>
      <h2>趋势追踪</h2>
      <p class="trends-note" id="trends-note"></p>
      <div class="trends-grid" id="trends-list"></div>
    </section>

    <section class="history" id="history-section" hidden>
      <h2>往期榜单</h2>
      <ul id="history-list"></ul>
    </section>

    <footer class="foot">
      <p id="updated-at">数据来自 GitHub Trending · 定时抓取自动更新</p>
      <p class="hint">点击往期条目可回看历史榜单 · 数据与页面由 GitHub Actions 自动生成</p>
    </footer>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
