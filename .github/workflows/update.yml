name: 抓取 Trending 数据并发布页面

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write # 提交 data/*.json
  pages: write # 发布 GitHub Pages
  id-token: write # Pages 部署需要

concurrency:
  group: trending-pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 Trending 数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 可选：配置后自动翻译中文标题/描述
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }} # 可选：默认智谱 https://open.bigmodel.cn/api/paas/v4
          LLM_MODEL: ${{ secrets.LLM_MODEL }} # 可选：默认 glm-4-flash（免费）
        run: node scripts/fetch-trending.mjs

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新 Trending 数据 [skip ci]"
            # 防并发竞争：push 被拒时变基（冲突以最新抓取的数据为准）后重推
            git push || { git pull --rebase -X theirs origin main && git push; }
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署到 Cloudflare Pages（国内可达备线）
        # 配置了 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 两个 secret 后自动启用
        # 注意：secrets 上下文不能用在 if: 里，是否启用改在 shell 中判断
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare 部署"
            exit 0
          fi
          npx --yes wrangler@3.90.0 pages deploy . --project-name=github-trending-weekly --branch=main --commit-dirty=true
